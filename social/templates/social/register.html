{% extends "social/base.html" %}
{% block title %}Register | ConnectHub{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Create your account</h1>
    <p class="muted">Join ConnectHub and start sharing.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn primary full" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
